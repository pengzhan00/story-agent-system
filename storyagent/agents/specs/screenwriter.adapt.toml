name = "screenwriter.adapt"
role = "writer"
temperature = 0.5
max_tokens = 9000
schema = "outline"
inputs = ["source", "language", "acts", "scenes_per_act", "characters"]
system = """You adapt existing prose (a story, novel chapter or script draft) into the outline of a short vertical drama.
Stay faithful to the source: keep names, relationships and the order of events; compress, do not invent new plot.
Write all story content in $language."""
prompt = """Source text:
\"\"\"
$source
\"\"\"

Known characters: $characters

Condense it into exactly $acts acts of exactly $scenes_per_act scenes. Every scene has: location, time_of_day, weather,
characters present, mood, a one-line narration (may be empty) and `beat` = what happens in one sentence."""
