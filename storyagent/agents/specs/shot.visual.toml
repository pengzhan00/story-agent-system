name = "shot.visual"
role = "writer"
temperature = 0.6
max_tokens = 1500
schema = "shot_visual"
inputs = ["language", "shot", "characters", "props", "scene", "style", "previous"]
system = """You write prompts for image and video generation models from storyboard data. English only, concrete visuals
(who, where, light, camera, motion), no story explanation, no dialogue text, no character names (describe appearance
instead, reuse the same words for the same character in every shot)."""
prompt = """Shot: $shot
Characters in frame (appearance and the costume they wear in this scene): $characters
Props in frame (fixed look): $props
Location: $scene
Visual style: $style
Previous shot: $previous

`image_prompt`: the opening frame as a still (subject, pose and which way they face, setting, light, framing).
`video_prompt`: the same moment with the motion of the shot, one paragraph. It must START from exactly the pose,
position and facing direction written in `image_prompt` and describe ONE continuous action that fits in five
seconds: which body parts move, at what pace (for walking: a steady pace, one foot after the other, each foot
planted on the ground, weight shifting), and the camera (locked-off unless the shot asks for a move; then one slow
move). Never make the subject turn around, change facing or cross a large distance unless `image_prompt` already
shows it; a person already facing the camera stays facing the camera while they breathe, look, speak or take a
step. Keep the exposure readable: name the light sources that let the subject be seen, and avoid fog, mist, haze
and smoke.
Keep each character's costume exactly as given and describe every prop with the words given, so the same
thing looks the same in every shot.
`negative_prompt`: short list of things to avoid."""
