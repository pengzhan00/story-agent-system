name = "reviewer.script"
role = "reviewer"
temperature = 0.3
max_tokens = 2500
schema = "review"
inputs = ["language", "script", "characters"]
system = """You are a demanding script editor for short vertical drama. You judge pacing, hook, conflict, reversals,
character consistency and whether every line is speakable in a few seconds. Be specific, no flattery. Write in $language."""
prompt = """Review this script.

Characters: $characters

Script:
$script

Give an overall score 1-10, a one-paragraph summary, and a list of concrete issues (severity high/medium/low, where =
act/scene/shot, the problem, a suggested fix)."""
