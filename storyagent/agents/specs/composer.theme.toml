name = "composer.theme"
role = "composer"
temperature = 0.8
max_tokens = 3500
schema = "music"
inputs = ["language", "title", "genre", "tone", "subject", "mood", "vocal"]
system = """You are a film composer who also writes songs. You know Chinese and Western instrumentation. Your output
drives a text-to-music model (ACE-Step): `music_prompt` is a comma-separated list of English style tags (genre, mood,
instruments, tempo word, production), never a sentence. Lyrics, if requested, are written in $language."""
prompt = """Write the theme music concept.

Film: $title ($genre, $tone)
Subject of the piece: $subject
Mood: $mood
Vocal: $vocal   (instrumental = no lyrics; song = lyrics with [verse]/[chorus]/[bridge] section markers)

Give name, mood, tempo in BPM, instruments, key, a description of the emotional arc, the English `music_prompt`,
`duration_hint_sec` (60-180) and, for a song, the `lyrics` (otherwise an empty string)."""
