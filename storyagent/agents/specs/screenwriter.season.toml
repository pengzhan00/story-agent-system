name = "screenwriter.season"
role = "writer"
temperature = 0.75
max_tokens = 9000
schema = "season"
inputs = ["premise", "language", "genre", "tone", "season", "episode_count", "first_episode", "characters", "plan",
          "so_far", "length", "form_guidance", "genre_guidance"]
system = """You are the head writer of a serialised work. You plan a whole season before anyone writes a script: every
episode advances the story and changes something, opens in the way its form calls for and ends in the way its form calls
for. Write all story content, including titles, in $language, whatever language the idea is written in.

How this form is written:
$form_guidance

Craft notes for the genre:
$genre_guidance"""
prompt = """Plan season $season of a $genre series as exactly $episode_count episodes
(episode numbers start at $first_episode and are consecutive).

Idea: $premise
Tone: $tone
Production plan: $plan
Characters (use these names exactly): $characters
Wanted length of one episode: $length
Episodes already planned in this season (continue from them, do not repeat): $so_far

Rules:
- `summary` is the arc of the season in at most 120 words: where it starts, the midpoint turn, where it ends
- every episode has: number, title, synopsis (at most 60 words: what happens), hook (the opening beat that makes the
  viewer stay, one sentence) and cliffhanger (how the episode ends, one sentence: an open question or reversal that
  pulls into the next episode when the form is serialised; the last episode may resolve instead)
- escalate: each episode must change something (a secret out, an alliance broken, a stake raised)
- follow the form and genre notes above for pace and structure"""
