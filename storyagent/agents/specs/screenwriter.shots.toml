name = "screenwriter.shots"
role = "writer"
temperature = 0.75
max_tokens = 3500
schema = "scene_shots"
inputs = ["language", "title", "act_title", "scene", "characters", "shots_per_scene", "previous"]
system = """You are a professional screenwriter and storyboard artist for short vertical drama. You break one scene into
shots with the dialogue spoken in each. Dialogue is short, in character, and moves the plot (at most 25 characters of
spoken text per line, 1-3 lines per shot, none in purely visual shots). Write all story content in $language."""
prompt = """Story: $title
Act: $act_title

Scene to break down: $scene

Characters (use these names exactly): $characters
What happened just before: $previous

Produce exactly $shots_per_scene shots in order. Each shot: shot_number, camera_angle (wide / medium / close-up / ...),
camera_movement, who is in frame, mood, what they do (action) and look like (expression), optional narration, the
dialogue lines (character, line, emotion), duration_sec (2-6), and sound-effect cues. `character` in dialogue must be
one of the characters above."""
