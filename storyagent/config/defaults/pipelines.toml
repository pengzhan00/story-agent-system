# -- TV series: long episodes, so few clips per episode and cards that tie episodes together ---------------------------
[pipelines.tv_series]
label_key = "pipeline.tv_series"
note_key = "pipeline.tv_series.note"
delivery_profile = "tv_landscape_1080"
tier = "preview"
requires = ["ollama", "acestep", "phosphene", "tool.ffmpeg", "tool.mflux", "tool.cosyvoice"]
[pipelines.tv_series.models]
"image.generate" = "flux2-klein-base-4b"
"image.edit" = "flux2-klein-base-4b-edit"
"video.generate" = "ltx-2.5-video"
"video.av" = "ltx-2.5-av"
"audio.tts" = "cosyvoice3-0.5b"
"audio.music" = "acestep-1.5-turbo"
"audio.sfx" = "stable-audio-3-medium"
"compose.assemble" = "ffmpeg-assemble"
[pipelines.tv_series.workflow]
video_share = 0.08
video_min_per_episode = 6
keyframe_from_references = true
[pipelines.tv_series.edit]
title_card = true
recap_card = true
next_card = true
scene_fade_sec = 0.5
j_cut_sec = 0.3
[pipelines.tv_series.mix]
loudnorm_i = -23.0      # broadcast loudness (EBU R128)

