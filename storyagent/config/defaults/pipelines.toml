# Pipeline plans: one chosen, complete set of models and settings per project (a project picks ONE when it is created,
# together with its picture frame). Nothing inside a project mixes models from different plans; to change a model,
# copy a plan under a new name in $STORY_AGENT_HOME/config/pipelines.toml and change it there - the whole plan changes.
#
#   delivery_profile : picture frame, direction and the length range (a profile in delivery.toml)
#   tier             : quality tier of a first production pass (draft | preview | final)
#   requires         : services/tools this plan needs (names from services.toml, or tool.<name>); the healthcheck
#                      for a project lists exactly these
#   models           : the model of every task kind the plan uses. image.generate, video.generate, audio.tts,
#                      audio.music and compose.assemble are required; any other kind not listed falls back to
#                      [defaults] in models.toml
#   model_params     : parameter overrides per model within this plan (a `tiers.<tier>` table inside overrides tiers)
#   workflow / edit / mix : merged over [workflow] / [edit] / [mix] for projects of this plan
# A plan that fails these checks is refused at load time with the reason.

[default]
pipeline = "vertical_drama"

# -- vertical (9:16) short drama / series: the stack validated end to end on the pilot ----------------------------------
[pipelines.vertical_drama]
label_key = "pipeline.vertical_drama"
note_key = "pipeline.vertical_drama.note"
delivery_profile = "series_vertical_720"
tier = "preview"
requires = ["ollama", "acestep", "phosphene", "tool.ffmpeg", "tool.mflux", "tool.cosyvoice"]
[pipelines.vertical_drama.models]
"image.generate" = "flux2-klein-base-4b"
"image.edit" = "flux2-klein-base-4b-edit"
"video.generate" = "ltx-2.5-video"
"video.av" = "ltx-2.5-av"
"audio.tts" = "cosyvoice3-0.5b"
"audio.music" = "acestep-1.5-turbo"
"audio.sfx" = "stable-audio-3-medium"
"compose.assemble" = "ffmpeg-assemble"
[pipelines.vertical_drama.workflow]
video_share = 0.2
keyframe_from_references = true
[pipelines.vertical_drama.edit]
title_card = false
next_card = true

# -- the same vertical drama with fast keyframes: shot keyframes are composed by FLUX.2 klein 4B *distilled* through
# ComfyUI (about 56 s instead of about 575 s on this machine, measured on one shot - see docs/PIPELINES.md). Faces and
# poses are a little less faithful than the Base model; use it for drafts, or for a whole series when time matters. A
# project that wants the Base keyframes picks vertical_drama instead (models are never mixed inside one project).
[pipelines.vertical_drama_fast]
label_key = "pipeline.vertical_drama_fast"
note_key = "pipeline.vertical_drama_fast.note"
delivery_profile = "series_vertical_720"
tier = "preview"
requires = ["ollama", "acestep", "phosphene", "comfy", "tool.ffmpeg", "tool.mflux", "tool.cosyvoice"]
[pipelines.vertical_drama_fast.models]
"image.generate" = "flux2-klein-base-4b"
"image.edit" = "flux2-klein-4b-edit-comfy"
"video.generate" = "ltx-2.5-video"
"video.av" = "ltx-2.5-av"
"audio.tts" = "cosyvoice3-0.5b"
"audio.music" = "acestep-1.5-turbo"
"audio.sfx" = "stable-audio-3-medium"
"compose.assemble" = "ffmpeg-assemble"
[pipelines.vertical_drama_fast.workflow]
video_share = 0.2
keyframe_from_references = true
[pipelines.vertical_drama_fast.edit]
title_card = false
next_card = true

