# LLM backends and per-role routing. Any backend can serve any role.
#   kind: ollama | llamacpp | openai_compat
#   service: take the URL from [services.<name>] (single source of truth); or give `url`.
# Backends are only probed, never started or stopped, unless you run `storyagent ops llm ...`.

[llm.backends.ollama]
kind = "ollama"
service = "ollama"
# How long Ollama keeps the model in memory after our last request. Short on purpose: calls inside one stage follow
# each other and reuse it, then the (25+ GiB) model is released so the media models have the memory. "0" = at once.
keep_alive = "30s"

[llm.backends.llamacpp]
kind = "llamacpp"
service = "llamacpp"

# Installed locally (2026-10-21): gemma4:31b, gpt-oss-20b. Point a role at any other model/backend in your own
# llm.toml, e.g. a fast MoE for the structural roles once it is pulled. `storyagent llm check` lists what is missing.
# gpt-oss-20b was tried for the default role (2026-10-21, 5 structured Chinese character requests): 2 of 5 put the
# name and the description into the wrong JSON fields, and it was not faster than a warm gemma4:31b. Not used.
[llm.roles.default]
backend = "ollama"
model = "gemma4:31b"

# Creative roles use the larger model installed locally.
[llm.roles.director]
backend = "ollama"
model = "gemma4:31b"

[llm.roles.writer]
backend = "ollama"
model = "gemma4:31b"

[llm.roles.reviewer]
backend = "ollama"
model = "gemma4:31b"

# Subtitle translation for multi-language delivery (short lines, faithful register).
[llm.roles.translator]
backend = "ollama"
model = "gemma4:31b"

# The other roles of the agents, listed so each can be chosen on the language-model screen. Same model as `default`
# today; `prompter` writes and translates the prompts of pictures, video, music and voices (the AI buttons).
[llm.roles.character]
backend = "ollama"
model = "gemma4:31b"

[llm.roles.scene]
backend = "ollama"
model = "gemma4:31b"

[llm.roles.sound]
backend = "ollama"
model = "gemma4:31b"

[llm.roles.composer]
backend = "ollama"
model = "gemma4:31b"

[llm.roles.prompter]
backend = "ollama"
model = "gemma4:31b"

# Per-rating routing (content.toml ratings): projects of that rating send their roles to these models instead. A rating
# that is `allow_remote = false` is refused any backend that is not on this computer (a `local = true/false` key in a
# backend's table overrides the loopback test). Empty by default; the example below is the shape, not a default:
#
#   [llm.ratings.restricted]                 # every role of a restricted project
#   backend = "ollama"
#   model = "your-local-model:tag"
#
#   [llm.ratings.restricted.roles.writer]    # one role only; beats the line above
#   backend = "ollama"
#   model = "another-local-model:tag"
#
# Order of choice: a model named by the call > the project's own choice on the language-model screen > this table >
# the global choice on that screen > [llm.roles.*].
