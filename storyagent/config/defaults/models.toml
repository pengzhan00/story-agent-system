layers = 40
reuse = 3


[models."longcat-avatar-1.5-q4"]
kind = "video.avatar"
provider = "longcat"
version = "q4-merged"
heavy = true
est_memory_gib = 30
license_tag = "mit"
commercial_ok = true
prompt_profile = "natural_en"
timeout_sec = 7200
[models."longcat-avatar-1.5-q4".params]
height = 480
width = 832
num_frames = 93

[models."ffmpeg-assemble"]
kind = "compose.assemble"
provider = "ffmpeg"
version = "ffmpeg"
heavy = false
est_memory_gib = 2
license_tag = "lgpl-gpl"
commercial_ok = true
timeout_sec = 3600

# LoRA training. Everything here is a *template* deep-merged with the job's params, so any
# training knob (epochs, rank, layers, learning rate, resolution ...) is configurable per job.
# Paths (model_path, data, checkpoint.output_path) are injected by the adapter.
[models."flux2-klein-4b-lora-trainer"]
kind = "train.lora"
provider = "lora_train"
version = "mflux-train"
family = "flux2-klein"
heavy = true
est_memory_gib = 64   # estimate; adjust after the first real run
license_tag = "flux2-klein-4b-apache-2.0"
commercial_ok = true
timeout_sec = 86400
[models."flux2-klein-4b-lora-trainer".train_template]
model = "flux2-klein-base-4b"
seed = 42
steps = 40
guidance = 1.0
low_ram = false
gradient_checkpointing = true
max_resolution = 1024
[models."flux2-klein-4b-lora-trainer".train_template.training_loop]
num_epochs = 60
batch_size = 1
timestep_low = 25
timestep_high = 40
[models."flux2-klein-4b-lora-trainer".train_template.optimizer]
name = "AdamW"
learning_rate = 0.0001
[models."flux2-klein-4b-lora-trainer".train_template.checkpoint]
save_frequency = 5
[models."flux2-klein-4b-lora-trainer".train_template.monitoring]
plot_frequency = 5
generate_image_frequency = 5
[[models."flux2-klein-4b-lora-trainer".train_template.lora_layers.targets]]
module_path = "transformer_blocks.{block}.attn.to_q"
blocks = { start = 0, end = 5 }
rank = 16
[[models."flux2-klein-4b-lora-trainer".train_template.lora_layers.targets]]
module_path = "transformer_blocks.{block}.attn.to_k"
blocks = { start = 0, end = 5 }
rank = 16
[[models."flux2-klein-4b-lora-trainer".train_template.lora_layers.targets]]
module_path = "transformer_blocks.{block}.attn.to_v"
blocks = { start = 0, end = 5 }
rank = 16
