# Model registry. Switching a model is a config change only: point
# [defaults] at another ref. `ref` strings are what the ledger stores.
#
#   kind     : a MediaKind value (storyagent/domain/enums.py), e.g. "video.generate"
#   provider : the runtime/adapter that executes it: comfy | acestep | cosyvoice | h3 | longcat | fastvideo | ffmpeg
#   family   : the underlying model family — the same weights may have several runtimes
#              (MiniMax H3 runs via h3.c or FastVideo-MLX); licence applies per family
#   heavy    : true => the broker allows only one heavy job at a time
#   license_tag / commercial_ok : copied into the ledger for every artifact

[defaults]
"image.generate" = "flux2-klein-4b"
"video.generate" = "ltx-2.3-22b-distilled"
"video.av" = "minimax-h3"
"video.avatar" = "longcat-avatar-1.5-q4"
"audio.tts" = "cosyvoice2-0.5b"
"audio.music" = "acestep-1.5-turbo"
"compose.assemble" = "ffmpeg-assemble"

[models."flux2-klein-4b"]
kind = "image.generate"
provider = "comfy"
version = "klein-4b"
heavy = false
est_memory_gib = 14
license_tag = "flux2-klein"
commercial_ok = true

[models."ltx-2.3-22b-distilled"]
kind = "video.generate"
provider = "comfy"
version = "distilled-1.1"
heavy = true
est_memory_gib = 60
license_tag = "ltx-community"
commercial_ok = true

[models."acestep-1.5-turbo"]
kind = "audio.music"
provider = "acestep"
version = "v15-turbo"
heavy = false
est_memory_gib = 20
license_tag = "acestep"
commercial_ok = true

[models."cosyvoice2-0.5b"]
kind = "audio.tts"
provider = "cosyvoice"
version = "CosyVoice2-0.5B"
heavy = false
est_memory_gib = 6
license_tag = "apache-2.0"
commercial_ok = true

[models."minimax-h3"]
family = "minimax-h3"
kind = "video.av"
provider = "h3"
version = "FL2VA+Ref2VA"
heavy = true
est_memory_gib = 48
# MiniMax H3 Community License: territory excludes EU/UK/South Korea/USA;
# commercial UIs must display "MiniMax H3".
license_tag = "minimax-h3-community"
commercial_ok = false
attribution = "MiniMax H3"

[models."longcat-avatar-1.5-q4"]
kind = "video.avatar"
provider = "longcat"
version = "q4-merged"
heavy = true
est_memory_gib = 30
license_tag = "mit"
commercial_ok = true

[models."fastvideo-fasth3"]
family = "minimax-h3"
kind = "video.av"
provider = "fastvideo"
version = "FastH3-8step-V2"
heavy = true
est_memory_gib = 27
license_tag = "minimax-h3-community"
commercial_ok = false
attribution = "MiniMax H3"

[models."ffmpeg-assemble"]
kind = "compose.assemble"
provider = "ffmpeg"
version = "ffmpeg"
heavy = false
est_memory_gib = 2
license_tag = "lgpl-gpl"
commercial_ok = true

[models."acestep-1.5-xl-sft"]
kind = "audio.music"
provider = "acestep"
version = "v15-xl-sft-bf16"
family = "acestep-1.5"
heavy = false
est_memory_gib = 28
license_tag = "acestep"
commercial_ok = true
