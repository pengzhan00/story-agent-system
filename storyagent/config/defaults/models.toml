height = 1536
steps = 6

# LTX-2.5 through the Phosphene panel (Pinokio app). One model, three kinds: picture+sound, picture only
# (sound stripped) and audio-driven lip-sync. Values are the operator's measured best recipe (see the notes in
# Obsidian "本机模型能力矩阵"); the panel silently clamps oversized resolutions, so jobs verify the rendered size.
#   Sizes are portrait (width x height) for a vertical drama; the measurements below were taken in landscape with the
#   same pixel counts.
#   draft   = balanced 576x1024, 5 s: ~110-126 s measured
#   preview = high 704x1280 16+5 steps, no upscale: 121 frames ~490 s, 73 frames ~270 s (2026-10-22 sweep: 12+4 left
#             smeared, warping walls and hedges behind a walking figure; 16+5 was sharp and stable, see
#             docs/reviews/2026-10-22_pilot-and-p0.md)
#   final   = high 832x1536 16+5 steps + fit_1080p/pipersr: ~590 s measured
# frames must satisfy frames % 8 == 1 (121 = 5 s at 24 fps); above 121 frames only quality=high keeps identity.
[models."ltx-2.5-av"]
kind = "video.av"
provider = "phosphene"
version = "ltx-2.5"
family = "ltx-2.5"
heavy = true
est_memory_gib = 64   # estimate (peak 40-62 GiB public numbers); adjust after measuring
license_tag = "ltx-community"   # LTX-2.x Community License + AUP: free commercial use below the revenue threshold
commercial_ok = true
prompt_profile = "ltx_av"
timeout_sec = 3600
[models."ltx-2.5-av".params]
width = 832
height = 1536
frames = 121
frame_rate = 24
quality = "high"
stage1_steps = 16
stage2_steps = 5
cfg_scale = 3.0
upscale = "fit_1080p"
upscale_method = "pipersr"
enhance = false
negative_prompt = "deformed hands, extra fingers, fused fingers, blurry, soft focus, low detail, horizontal stripes, banding, flicker, jitter, warped background, sliding feet, floating, ghosting, plastic skin, text, watermark, subtitles, logo"
[models."ltx-2.5-av".tiers.draft]
width = 576
height = 1024
quality = "balanced"
upscale = "off"
[models."ltx-2.5-av".tiers.preview]
width = 704
height = 1280
upscale = "off"

[models."ltx-2.5-video"]
kind = "video.generate"
provider = "phosphene"
version = "ltx-2.5"
family = "ltx-2.5"
heavy = true
est_memory_gib = 64
license_tag = "ltx-community"
commercial_ok = true
prompt_profile = "ltx_av"
timeout_sec = 3600
[models."ltx-2.5-video".params]
width = 832
height = 1536
frames = 121
frame_rate = 24
quality = "high"
stage1_steps = 16
stage2_steps = 5
cfg_scale = 3.0
upscale = "fit_1080p"
upscale_method = "pipersr"
enhance = false
negative_prompt = "deformed hands, extra fingers, fused fingers, blurry, soft focus, low detail, horizontal stripes, banding, flicker, jitter, warped background, sliding feet, floating, ghosting, plastic skin, text, watermark, subtitles, logo"
[models."ltx-2.5-video".tiers.draft]
width = 576
height = 1024
quality = "balanced"
upscale = "off"
[models."ltx-2.5-video".tiers.preview]
width = 704
height = 1280
upscale = "off"

