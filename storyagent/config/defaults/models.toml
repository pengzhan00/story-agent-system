# Model registry. Switching a model is a config change only: point [defaults] at another ref.
#
#   kind     : a MediaKind value (storyagent/domain/enums.py), e.g. "video.generate"
#   provider : the runtime/adapter that executes it:
#              llm | mflux | phosphene | acestep | cosyvoice | seedvc | whisper | h3 | longcat | lora_train | ffmpeg
#   family   : the underlying model family — the same weights may have several runtimes
#              (e.g. one model through several runtimes); licence applies per family
#   heavy    : true => the broker runs at most one heavy job at a time
#   license_tag / commercial_ok / attribution : copied into the ledger for every artifact
#   params   : model defaults;  tiers.<draft|preview|final> : per-tier overrides on top of params
#   prompt_profile : how the final prompt is phrased for this model (see media/specs.py)
#   timeout_sec    : wall-clock limit for one job
#
# Parameter precedence (low -> high): adapter built-ins < params < tiers.<tier>
#   < projects.settings.models.<ref> < per-job params.
# Values below come from the legacy configuration or the tools' documented defaults;
# anything unknown is left to the adapter. They are starting points, not rules.

[defaults]
"image.generate" = "flux2-klein-base-4b"
"image.edit" = "flux2-klein-base-4b-edit"
"video.generate" = "ltx-2.5-video"
"video.av" = "ltx-2.5-av"
"video.lipsync" = "ltx-2.5-lipsync"
"video.avatar" = "longcat-avatar-1.5-q4"
"audio.tts" = "cosyvoice3-0.5b"
"audio.convert" = "seed-vc-v2"
"text.story" = "llm-story"
"text.script" = "llm-script"
"text.asr" = "whisper-large-v3-turbo"
"audio.music" = "acestep-1.5-turbo"
"compose.assemble" = "ffmpeg-assemble"
"train.lora" = "flux2-klein-4b-lora-trainer"

# FLUX.2 klein through the mflux CLI (MLX). `weights` is a LOCAL directory (nothing is downloaded at run time);
# `base_model` names the built-in mflux model it is. klein 4B is Apache-2.0; klein 9B is non-commercial and a LoRA
# keeps the licence of its base model. Unset sampling parameters fall back to the tool's own defaults.
[models."flux2-klein-base-4b"]
kind = "image.generate"
provider = "mflux"
version = "klein-base-4b"
family = "flux2-klein"
heavy = false
est_memory_gib = 24   # estimate; adjust after measuring
license_tag = "flux2-klein-4b-apache-2.0"
commercial_ok = true
prompt_profile = "natural_en"
timeout_sec = 1800
command = "mflux-generate-flux2"
weights = "~/models/flux2-klein-base-4B"
base_model = "flux2-klein-base-4b"
negative_prompt = false   # FLUX.2 has no negative prompt: describe what you want instead

# Measured on a fixed seed (640x896): 20 steps at 512x768 gave a distorted face and a tangled weapon; 30-50 steps
# with guidance 3.5-5 gave clean faces and hands. Guidance is the only quality knob besides steps.
[models."flux2-klein-base-4b".params]
width = 768
height = 1024
steps = 30
guidance = 4.0
[models."flux2-klein-base-4b".tiers.draft]
width = 640
height = 896
steps = 24
[models."flux2-klein-base-4b".tiers.preview]
steps = 30
[models."flux2-klein-base-4b".tiers.final]
width = 896
height = 1280
steps = 50

[models."flux2-klein-base-4b-edit"]
kind = "image.edit"
provider = "mflux"
version = "klein-base-4b"
family = "flux2-klein"
heavy = false
est_memory_gib = 24
license_tag = "flux2-klein-4b-apache-2.0"
commercial_ok = true
prompt_profile = "natural_en"
timeout_sec = 1800
command = "mflux-generate-flux2-edit"
weights = "~/models/flux2-klein-base-4B"
base_model = "flux2-klein-base-4b"
negative_prompt = false

[models."flux2-klein-base-4b-edit".params]
steps = 30
guidance = 4.0

# LTX-2.5 through the Phosphene panel (Pinokio app). One model, three kinds: picture+sound, picture only
# (sound stripped) and audio-driven lip-sync. Values are the operator's measured best recipe (see the notes in
# Obsidian "本机模型能力矩阵"); the panel silently clamps oversized resolutions, so jobs verify the rendered size.
#   draft   = balanced 1024x576, 5 s: 108 s measured
#   preview = high 1280x704 12+4 steps, no upscale: not measured on its own
#   final   = high 1536x832 16+5 steps + fit_1080p/pipersr: ~590 s measured
# frames must satisfy frames % 8 == 1 (121 = 5 s at 24 fps); above 121 frames only quality=high keeps identity.
[models."ltx-2.5-av"]
kind = "video.av"
provider = "phosphene"
version = "ltx-2.5"
family = "ltx-2.5"
heavy = true
est_memory_gib = 64   # estimate (peak 40-62 GiB public numbers); adjust after measuring
license_tag = "ltx-community"   # LTX-2.x Community License + AUP: free commercial use below the revenue threshold
commercial_ok = true
prompt_profile = "ltx_av"
timeout_sec = 3600
[models."ltx-2.5-av".params]
width = 1536
height = 832
frames = 121
frame_rate = 24
quality = "high"
stage1_steps = 16
stage2_steps = 5
cfg_scale = 3.0
upscale = "fit_1080p"
upscale_method = "pipersr"
enhance = false
negative_prompt = "extra swords, duplicate weapons, multiple blades, deformed hands, extra fingers, fused fingers, blurry, soft focus, low detail, underexposed, dark, heavy fog, plastic skin, text, watermark, subtitles, logo"
[models."ltx-2.5-av".tiers.draft]
width = 1024
height = 576
quality = "balanced"
upscale = "off"
[models."ltx-2.5-av".tiers.preview]
width = 1280
height = 704
stage1_steps = 12
stage2_steps = 4
upscale = "off"

[models."ltx-2.5-video"]
kind = "video.generate"
provider = "phosphene"
version = "ltx-2.5"
family = "ltx-2.5"
heavy = true
est_memory_gib = 64
license_tag = "ltx-community"
commercial_ok = true
prompt_profile = "ltx_av"
timeout_sec = 3600
[models."ltx-2.5-video".params]
width = 1536
height = 832
frames = 121
frame_rate = 24
quality = "high"
stage1_steps = 16
stage2_steps = 5
cfg_scale = 3.0
upscale = "fit_1080p"
upscale_method = "pipersr"
enhance = false
negative_prompt = "extra swords, duplicate weapons, multiple blades, deformed hands, extra fingers, fused fingers, blurry, soft focus, low detail, underexposed, dark, heavy fog, plastic skin, text, watermark, subtitles, logo"
[models."ltx-2.5-video".tiers.draft]
width = 1024
height = 576
quality = "balanced"
upscale = "off"
[models."ltx-2.5-video".tiers.preview]
width = 1280
height = 704
stage1_steps = 12
stage2_steps = 4
upscale = "off"

# Lip-sync: a portrait image + a speech audio file (refs); the mouth follows the audio. Limited to ~5 s per clip.
[models."ltx-2.5-lipsync"]
kind = "video.lipsync"
provider = "phosphene"
version = "ltx-2.5"
family = "ltx-2.5"
heavy = true
est_memory_gib = 64
license_tag = "ltx-community"
commercial_ok = true
prompt_profile = "ltx_av"
timeout_sec = 3600
[models."ltx-2.5-lipsync".params]
width = 1024
height = 576
frames = 121
frame_rate = 24
quality = "high"
enhance = false


[models."acestep-1.5-turbo"]
kind = "audio.music"
provider = "acestep"
version = "v15-turbo"
family = "acestep-1.5"
heavy = false
est_memory_gib = 20
license_tag = "acestep"
commercial_ok = true
prompt_profile = "music_tags"
timeout_sec = 900
api_model = "acestep-v15-turbo"   # name on the standalone ACE-Step server (GET /v1/model_inventory)
[models."acestep-1.5-turbo".params]
duration = 30
steps = 8
guidance_scale = 7.0
vocal_language = "zh"
infer_method = "ode"

[models."acestep-1.5-xl-sft"]
kind = "audio.music"
provider = "acestep"
version = "v15-xl-sft-bf16"
family = "acestep-1.5"
heavy = false
est_memory_gib = 28
license_tag = "acestep"
commercial_ok = true
prompt_profile = "music_tags"
timeout_sec = 1800
# Not in the standalone server's checkpoints yet (only the turbo DiT is): jobs fail validation with
# `missing_model` until it is installed there. Recipe from the operator's notes (guofeng with vocals):
# steps 50, cfg 2.0, bpm 65, E minor; keep a single clip <= 240 s. They are starting points, not rules.
api_model = "acestep-v15-xl-sft"
[models."acestep-1.5-xl-sft".params]
duration = 30
steps = 50
guidance_scale = 2.0
bpm = 65
key_scale = "E minor"
vocal_language = "zh"

# CosyVoice 3.0 (Fun-CosyVoice3-0.5B-2512): 3 s of reference is enough, adjustable speed, faster than v2
# (same 18-character line: 3.64 s vs 5.00 s). Default since 2026-10-20; cosyvoice2-0.5b stays as the fallback.
[models."cosyvoice3-0.5b"]
kind = "audio.tts"
provider = "cosyvoice"
version = "Fun-CosyVoice3-0.5B-2512"
heavy = false
est_memory_gib = 6
license_tag = "apache-2.0"
commercial_ok = true
prompt_profile = "plain"
timeout_sec = 900
engine = "cv3"
model_dir = "~/models/cosyvoice3/Fun-CosyVoice3-0.5B"
[models."cosyvoice3-0.5b".params]
mode = "zero_shot"
sample_rate = 24000
output_format = "wav"
speed = 1.0
ref_min_sec = 3
ref_max_sec = 20
auto_transcribe = true

[models."cosyvoice2-0.5b"]
kind = "audio.tts"
provider = "cosyvoice"
version = "CosyVoice2-0.5B"
heavy = false
est_memory_gib = 6
license_tag = "apache-2.0"
commercial_ok = true
prompt_profile = "plain"
timeout_sec = 900
engine = "cv2"
[models."cosyvoice2-0.5b".params]
mode = "zero_shot"
sample_rate = 24000
output_format = "wav"
speed = 1.0
ref_min_sec = 3     # reference voice length window (3-10 s works best)
ref_max_sec = 20
auto_transcribe = true

# Voice conversion (Seed-VC): the performance (words, timing, emotion) of a source recording is re-voiced as the
# reference speaker. Two engines, same adapter: v2 (speech, default; its AR/CFM checkpoints are passed explicitly
# because its own hub lookup is not local) and v1 with f0_condition (singing; pitch-aware 44.1 kHz).
# separate_vocals = true runs Demucs first and mixes the accompaniment back (a song). Code is GPL-3.0; the weights'
# own terms were not verified here: check before commercial use. A 10-30 s clean reference matches the timbre best.
[models."seed-vc-v2"]
kind = "audio.convert"
provider = "seedvc"
version = "v2"
heavy = false
est_memory_gib = 10   # estimate; adjust after measuring
license_tag = "gpl-3.0-code"
commercial_ok = true
prompt_profile = "plain"
timeout_sec = 1800
engine = "v2"
ar_checkpoint = "checkpoints/ar_base.pth"
cfm_checkpoint = "checkpoints/cfm_small.pth"
[models."seed-vc-v2".params]
# 13 is the upstream calibration; on this machine the step count barely changes the time (3.7 s of audio:
# 30 steps 16.4 s, 13 steps 14.6 s, 8 steps 14.8 s: the vocoder dominates)
diffusion_steps = 13
length_adjust = 1.0
intelligibility_cfg_rate = 0.7
similarity_cfg_rate = 0.7
top_p = 0.9
temperature = 1.0
repetition_penalty = 1.0
convert_style = false
ref_min_sec = 3
ref_max_sec = 60
[models."seed-vc-v2".tiers.draft]
diffusion_steps = 8
[models."seed-vc-v2".tiers.final]
diffusion_steps = 30

[models."seed-vc"]
kind = "audio.convert"
provider = "seedvc"
version = "v1-f0"
heavy = false
est_memory_gib = 8
license_tag = "gpl-3.0-code"
commercial_ok = true
prompt_profile = "plain"
timeout_sec = 1800
engine = "v1"
[models."seed-vc".params]
diffusion_steps = 30
length_adjust = 1.0
inference_cfg_rate = 0.7
f0_condition = true
auto_f0_adjust = false
fp16 = true
ref_min_sec = 3
ref_max_sec = 60
[models."seed-vc".tiers.draft]
diffusion_steps = 15
[models."seed-vc".tiers.final]
diffusion_steps = 50

# Language-model writing (story, script). Runs in the worker through the LLM roles of llm.toml, so the model is picked
# there (role) or pinned here (params.model). `agent` names the prompt (agents/specs, editable on the Prompts page).
[models."llm-story"]
kind = "text.story"
provider = "llm"
version = "role"
heavy = false
est_memory_gib = 0   # the language model is already resident for the workflow; heavy media jobs hold it back
license_tag = "local-llm"
commercial_ok = true
timeout_sec = 900
[models."llm-story".params]
agent = "workshop.story"
role = "writer"
temperature = 0.8
max_tokens = 4000

[models."llm-script"]
kind = "text.script"
provider = "llm"
version = "role"
heavy = false
est_memory_gib = 0
license_tag = "local-llm"
commercial_ok = true
timeout_sec = 900
[models."llm-script".params]
agent = "workshop.script"
role = "writer"
temperature = 0.7
max_tokens = 8000

[models."whisper-large-v3-turbo"]
kind = "text.asr"
provider = "whisper"
version = "ggml-large-v3-turbo"
heavy = false
est_memory_gib = 3
license_tag = "mit"
commercial_ok = true
timeout_sec = 900
[models."whisper-large-v3-turbo".params]
language = "zh"

[models."minimax-h3"]
kind = "video.av"
provider = "h3"
version = "FL2VA+Ref2VA"
family = "minimax-h3"
heavy = true
est_memory_gib = 48
# MiniMax H3 Community License: territory excludes EU/UK/South Korea/USA;
# commercial UIs must display "MiniMax H3".
license_tag = "minimax-h3-community"
commercial_ok = false
attribution = "MiniMax H3"
prompt_profile = "h3_structured"
timeout_sec = 7200
[models."minimax-h3".params]
