# Service endpoints and local tool locations.
# Override any key in <STORY_AGENT_HOME>/config/services.toml or via env
# (STORY_AGENT_<NAME>_URL, e.g. STORY_AGENT_COMFY_URL).
# Paths may start with "~". Nothing in the code base may hard-code these.

[services.comfy]
url = "http://127.0.0.1:8188"
health_path = "/system_stats"

[services.acestep]
url = "http://127.0.0.1:8001"
health_path = "/v1/models"

[services.ollama]
url = "http://127.0.0.1:11434"
health_path = "/api/tags"

# FastVideo MLX server. NOT 8000: that port is taken by Nodus/CollabOS.
[services.fastvideo]
url = "http://127.0.0.1:8002"
health_path = "/health"

# Read-only probe target; never started, restarted or modified by this system.
[services.nodus]
url = "http://127.0.0.1:8000"
health_path = "/"
probe_only = true

# Subprocess / library style tools (no service).
[tools.h3]
binary = "~/myworkspace/h3.c/h3"
model_dir = "~/myworkspace/MiniMax-H3"

[tools.longcat]
root = "~/myworkspace/longcat-avatar-mlx"
python = "~/myworkspace/longcat-avatar-mlx/.venv/bin/python"
variant = "q4-merged"

[tools.cosyvoice]
root = "~/cosyvoice"
python = "~/cosyvoice/venv/bin/python"
workdir = "~/cosyvoice/CosyVoice"
script = "~/cosyvoice/clone_tts.py"

[tools.fastvideo]
root = "~/myworkspace/FastVideo"
python = "~/myworkspace/FastVideo/.venv/bin/python"

[tools.ffmpeg]
# Needs libass (subtitles filter). Empty = auto-detect on PATH / Homebrew.
binary = ""
ffprobe = ""

[runtime]
# What to do with models resident in Ollama before a heavy media job:
#   never = leave Ollama alone (default), ask = require operator confirmation,
#   auto  = `ollama stop <model>` for every resident model.
ollama_unload_policy = "never"
# Wrap long jobs in `caffeinate -i` on macOS.
caffeinate = true
# Total unified-memory budget (GiB) the broker may hand out to running jobs.
memory_budget_gib = 96
