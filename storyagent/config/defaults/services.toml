# Service endpoints and local tool locations.
# Override any key in <STORY_AGENT_HOME>/config/services.toml or via env
# (STORY_AGENT_<NAME>_URL, e.g. STORY_AGENT_COMFY_URL).
# Paths may start with "~". Nothing in the code base may hard-code these.

[services.comfy]
url = "http://127.0.0.1:8188"
health_path = "/system_stats"

[services.acestep]
url = "http://127.0.0.1:8001"
health_path = "/v1/models"

[services.ollama]
url = "http://127.0.0.1:11434"
health_path = "/api/tags"

# Phosphene panel (Pinokio app) hosting LTX-2.5. Started by the operator (open -a Pinokio); never launched here.
[services.phosphene]
url = "http://127.0.0.1:8198"
health_path = "/status"

# FastVideo MLX server. NOT 8000: that port is taken by Nodus/CollabOS.
[services.fastvideo]
url = "http://127.0.0.1:8002"
health_path = "/health"

# Read-only probe target; never started, restarted or modified by this system.
# llama.cpp llama-server (OpenAI-compatible). Off by default: probed only when enabled.
[services.llamacpp]
url = "http://127.0.0.1:8080"
health_path = "/health"
enabled = false

[services.nodus]
url = "http://127.0.0.1:8000"
health_path = "/"
probe_only = true

# Subprocess / library style tools (no service).
[tools.h3]
binary = "~/myworkspace/h3.c/h3"
model_dir = "~/myworkspace/MiniMax-H3"

[tools.longcat]
root = "~/myworkspace/longcat-avatar-mlx"
python = "~/myworkspace/longcat-avatar-mlx/.venv/bin/python"
weights_dir = "~/myworkspace/longcat-avatar-mlx/weights"
variant_dir = "LongCat-Video-Avatar-1.5-q4-dmd-merged"

[tools.cosyvoice]
root = "~/cosyvoice"
python = "~/cosyvoice/venv/bin/python"
workdir = "~/cosyvoice/CosyVoice"
script = "~/cosyvoice/clone_tts.py"
model_dir = "~/cosyvoice/CosyVoice/pretrained_models/CosyVoice2-0.5B"

[tools.fastvideo]
root = "~/myworkspace/FastVideo"
python = "~/myworkspace/FastVideo/.venv/bin/python"
# Converted FastH3 weights (not downloaded yet; downloading/converting needs the operator's go-ahead).
weights_dir = ""

# LoRA training (mflux-train). Paths only; the training recipe lives in models.toml (train_template).
[tools.lora_train]
command = "~/.local/bin/mflux-train"
root = "~/myworkspace/flux2-lora"
base_model_dir = "~/models/flux2-klein-base-4B"

# mflux command-line tools (image generate / edit); the model entries name the command to run.
[tools.mflux]
bin_dir = "~/.local/bin"

# whisper.cpp (ASR: subtitles, transcript of a cloning reference, back-check of generated dialogue).
[tools.whisper]
binary = "whisper-cli"   # a name on PATH or an absolute path
model = "~/myworkspace/models/whisper/ggml-large-v3-turbo.bin"

[tools.ffmpeg]
# Needs libass (subtitles filter) and ideally whisper: use ffmpeg-full. Falls back to PATH if the file is missing.
binary = "/opt/homebrew/opt/ffmpeg-full/bin/ffmpeg"
ffprobe = "/opt/homebrew/opt/ffmpeg-full/bin/ffprobe"

[runtime]
# What to do with LLM models resident in memory (Ollama, llama.cpp, ...) before a heavy media job:
#   never = leave them alone (default), ask = hold the job until the operator unloads them
#   (`storyagent ops llm-unload`), auto = unload via the backend API.
llm_unload_policy = "never"
# Unknown job params: false = pass through with a warning, true = reject as failed_validation.
strict_params = false
# A new successful candidate becomes the current asset automatically (false = pick manually).
auto_adopt = true
# Concurrent non-heavy jobs the worker may run next to (at most) one heavy job.
max_light_jobs = 2
# Job lease: a worker that stops heartbeating for lease_seconds loses its jobs to re-queue.
lease_seconds = 60
heartbeat_seconds = 15
poll_interval_seconds = 2
# Wrap long jobs in `caffeinate -i` on macOS.
caffeinate = true
# Total unified-memory budget (GiB) the broker may hand out to running jobs.
memory_budget_gib = 96

[api]
# `storyagent serve`. Loopback only by default: there is no authentication, so do not expose it on a LAN.
host = "127.0.0.1"
port = 8765
# Largest accepted upload (reference audio/images/footage/LoRA files), in MiB.
max_upload_mb = 2048
# Browser origins allowed to call the API (the Vite dev server; empty = same-origin only).
cors_origins = ["http://localhost:5173"]
sse_poll_seconds = 0.5
sse_keepalive_seconds = 15

[healthcheck]
# Entries that must be "ok" for the healthcheck exit code to be 0. Names: a service (comfy), or tool.<name>.
required = ["comfy", "acestep", "ollama", "tool.ffmpeg"]
# Below this much free disk (GiB) on the data home the system entry reports "degraded".
min_free_gib = 50
