# Service endpoints and local tool locations.
# Override any key in <STORY_AGENT_HOME>/config/services.toml or via env
# (STORY_AGENT_<NAME>_URL, e.g. STORY_AGENT_OLLAMA_URL).
# Paths may start with "~". Nothing in the code base may hard-code these.

[services.acestep]
url = "http://127.0.0.1:8001"
health_path = "/v1/models"

# ComfyUI (Comfy Desktop app or a standalone server): runs the workflow templates of the `comfy` provider.
[services.comfy]
url = "http://127.0.0.1:8188"
health_path = "/system_stats"

[services.ollama]
url = "http://127.0.0.1:11434"
health_path = "/api/tags"

# Phosphene panel (Pinokio app) hosting LTX-2.5. The launch screen opens the Pinokio app ([launch.phosphene]).
[services.phosphene]
url = "http://127.0.0.1:8198"
health_path = "/status"

# llama.cpp llama-server (OpenAI-compatible). Off by default: probed only when enabled.
[services.llamacpp]
url = "http://127.0.0.1:8080"
health_path = "/health"
enabled = false

# How the launch screen starts a service ("Start" button, `storyagent ops launch`). Only services listed here can be
# started from the system; the rest (llamacpp) are probed only. The command is an argv list
# (no shell), run detached with its output in <home>/logs/launch_<name>.log. Nothing is ever stopped or killed.
#   argv           command; a bare name is looked up on PATH, "~" is expanded
#   cwd            working directory ("" = the data home)
#   env            extra environment variables
#   bulk           true = included in "start everything"
#   launcher       true = the command only opens an app and exits at once (the service comes up afterwards)
#   timeout_sec    how long to wait for the health probe before the launch counts as failed
#   hint_key       i18n key of a note shown next to the service
[launch.ollama]
argv = ["ollama", "serve"]
bulk = true
timeout_sec = 60

[launch.acestep]
argv = [".venv/bin/python3", "-m", "acestep.api_server", "--host", "127.0.0.1", "--port", "8001",
        "--lm-model-path", "acestep-5Hz-lm-1.7B"]
cwd = "~/ACE-Step-1.5"
bulk = true
timeout_sec = 180
hint_key = "launch.hint.acestep"
[launch.acestep.env]
ACESTEP_LM_BACKEND = "mlx"
TOKENIZERS_PARALLELISM = "false"

[launch.phosphene]
argv = ["open", "-a", "Pinokio"]
bulk = true
launcher = true
timeout_sec = 240
hint_key = "launch.hint.phosphene"

# Subprocess / library style tools (no service).
[tools.h3]
binary = "~/myworkspace/h3.c/h3"
model_dir = "~/myworkspace/MiniMax-H3"

[tools.longcat]
root = "~/myworkspace/longcat-avatar-mlx"
python = "~/myworkspace/longcat-avatar-mlx/.venv/bin/python"
weights_dir = "~/myworkspace/longcat-avatar-mlx/weights"
variant_dir = "LongCat-Video-Avatar-1.5-q4-dmd-merged"
# Only local files: the script would otherwise wait for the model hub (hangs without a route to it). Needs
# openai/whisper-large-v3 (preprocessor config) in the local Hugging Face cache.
offline = true

[tools.cosyvoice]
root = "~/cosyvoice"
python = "~/cosyvoice/venv/bin/python"
workdir = "~/cosyvoice/CosyVoice"
script = "~/cosyvoice/clone_tts.py"
model_dir = "~/cosyvoice/CosyVoice/pretrained_models/CosyVoice2-0.5B"

# Seed-VC (voice conversion). GPL-3.0 code, run as a separate process.
[tools.seedvc]
root = "~/seed-vc"
python = "~/venvs/seedvc/bin/python"
# Use only local checkpoints: a missing one would otherwise hang inside the hub downloader.
offline = true


# LoRA training (mflux-train). Paths only; the training recipe lives in models.toml (train_template).
[tools.lora_train]
command = "~/.local/bin/mflux-train"
root = "~/myworkspace/flux2-lora"
base_model_dir = "~/models/flux2-klein-base-4B"

# mflux command-line tools (image generate / edit); the model entries name the command to run.
[tools.mflux]
bin_dir = "~/.local/bin"

# whisper.cpp (ASR: subtitles, transcript of a cloning reference, back-check of generated dialogue).
[tools.whisper]
binary = "whisper-cli"   # a name on PATH or an absolute path
model = "~/myworkspace/models/whisper/ggml-large-v3-turbo.bin"

[tools.ffmpeg]
# Needs libass (subtitles filter) and ideally whisper: use ffmpeg-full. Falls back to PATH if the file is missing.
binary = "/opt/homebrew/opt/ffmpeg-full/bin/ffmpeg"
ffprobe = "/opt/homebrew/opt/ffmpeg-full/bin/ffprobe"

[runtime]
# What to do with LLM models resident in memory (Ollama, llama.cpp, ...) before a heavy media job:
#   never = leave them alone (default), ask = hold the job until the operator unloads them
#   (`storyagent ops llm-unload`), auto = unload via the backend API.
llm_unload_policy = "never"
# Unknown job params: false = pass through with a warning, true = reject as failed_validation.
strict_params = false
# A new successful candidate becomes the current asset automatically (false = pick manually).
auto_adopt = true
# Asset packs: largest zip that may be unpacked (GiB).
pack_max_gib = 50
# Loose folder import: the first rule whose file-name pattern matches decides kind and slot. target = shot (group "n" =
# the n-th shot of the project), character (group "name"; slot may use {id}), music (the first music theme) or none.
loose_rules = [
  { pattern = '^shot[_-]?(?P<n>\d+)\.(mp4|mov|webm)$', kind = "video.generate", slot = "main", target = "shot" },
  { pattern = '^shot[_-]?(?P<n>\d+)\.(png|jpg|jpeg|webp)$', kind = "image.generate", slot = "main", target = "shot" },
  { pattern = '^(?P<name>.+)\.(png|jpg|jpeg|webp)$', kind = "image.generate", slot = "character.portrait:{id}", target = "character" },
  { pattern = '^bgm.*\.(wav|mp3|m4a|flac)$', kind = "audio.music", slot = "music.bgm:{id}", target = "music" },
]
# Local jobs running at the same time, of any kind: 1 = a strictly linear queue (one model in memory at a time, the
# default), 0 = no overall cap (then max_light_jobs and one heavy job apply).
max_concurrent_jobs = 1
# Before a job starts, the machine as a whole (the operator's other apps included) must have its memory free plus this
# headroom, else the job waits (reason `system_memory`) instead of pushing the system into swap. macOS only.
check_system_memory = true
memory_headroom_gib = 8
# Concurrent non-heavy jobs the worker may run next to (at most) one heavy job (when max_concurrent_jobs allows).
max_light_jobs = 2
# Cloud (remote) models: concurrent jobs they may run, and whether prompts and reference files may leave this machine
# at all. Off until you switch it on here or per project (projects.settings.allow_remote). See docs/CLOUD.md.
max_remote_jobs = 4
allow_remote = false
# A language-model call never starts while a heavy media job is running (a 30B model plus a 50 GiB video model
# does not fit in memory). Workflow stages wait up to this many seconds for the heavy job to finish, then fail with
# `heavy_busy`; interactive requests (script review) fail at once. 0 = do not wait.
llm_wait_for_heavy_sec = 900
# Job lease: a worker that stops heartbeating for lease_seconds loses its jobs to re-queue.
lease_seconds = 60
heartbeat_seconds = 15
poll_interval_seconds = 2
# Wrap long jobs in `caffeinate -i` on macOS.
caffeinate = true
# Total unified-memory budget (GiB) the broker may hand out to running jobs.
memory_budget_gib = 96

[api]
# `storyagent serve`. Loopback only by default: there is no authentication, so do not expose it on a LAN.
host = "127.0.0.1"
port = 8765
# Largest accepted upload (reference audio/images/footage/LoRA files), in MiB.
max_upload_mb = 2048
# Browser origins allowed to call the API (the Vite dev server; empty = same-origin only).
cors_origins = ["http://localhost:5173"]
# Built web client served at "/" (`pnpm build` in web/). Empty = web/dist next to the package; missing = API only.
web_dir = ""
sse_poll_seconds = 0.5
sse_keepalive_seconds = 15

[workflow]
# A shot keyframe is composed from the approved portraits and the scene image (reference images of an image-edit job)
# instead of being imagined again from words. false = text-to-image only, as before.
keyframe_from_references = true
# Shot tiering: only some shots get a video clip, the rest are a keyframe with a slow move (a clip costs minutes to
# hours). A share of each episode's shots (the opening hook, the cliffhanger, act openers, camera moves first), at
# least `video_min_per_episode`, and optionally at most `video_budget_hours` of machine time for clips in the whole
# series (0 = no limit). Per project: projects.settings video_share / video_budget_hours; per shot: treatment.
# Speaker labels that are not characters (narration): never added to the cast when a later episode uses them.
non_character_speakers = ["narrator", "voice-over", "voiceover", "v.o.", "caption", "旁白", "画外音", "字幕"]
video_share = 0.2
video_min_per_episode = 2
video_budget_hours = 0
# The produce stage turns every spec into media. Quality tier for the first pass (draft | preview | final).
tier = "draft"
# Library voice used for a character without a voice of their own, e.g. "library:voice/narrator". Empty = such
# lines are skipped and the episode shows them as subtitles only (the report says which).
default_voice = ""
# Seconds between checks of the job ledger while the stage waits for the worker.
poll_seconds = 1.0
# How many takes per spec in the first pass (the creative panel can always make more).
takes = 1

[healthcheck]
# Entries that must be "ok" for the healthcheck exit code to be 0. Names: a service (ollama), or tool.<name>.
required = ["ollama", "acestep", "phosphene", "tool.ffmpeg"]
# Below this much free disk (GiB) on the data home the system entry reports "degraded".
min_free_gib = 50
