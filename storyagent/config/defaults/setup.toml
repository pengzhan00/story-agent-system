file = "ggml-large-v3-turbo.bin"

# -- music: ACE-Step 1.5 ------------------------------------------------------------------------------------------------
[components.acestep_runtime]
capability = "music"
size_gib = 2.0
license = "MIT"
url = "https://github.com/ACE-Step/ACE-Step-1.5"
health = ["acestep"]
after = ["uv", "xcode_clt"]
[components.acestep_runtime.layout]
"launch:acestep.cwd" = "ACE-Step-1.5"
[[components.acestep_runtime.detect]]
