[[components.acestep_runtime.steps]]
kind = "command"
argv = ["uv", "sync"]
cwd = "{launch:acestep.cwd}"

[components.acestep_weights]
capability = "music"
size_gib = 9.4
measured = true
license = "MIT"
url = "https://huggingface.co/ACE-Step/Ace-Step1.5"
after = ["acestep_runtime"]
[[components.acestep_weights.detect]]
kind = "path"
ref = "launch:acestep.cwd"
sub = "checkpoints/acestep-v15-turbo"
is = "dir"
[[components.acestep_weights.detect]]
kind = "path"
ref = "launch:acestep.cwd"
sub = "checkpoints/acestep-5Hz-lm-1.7B"
is = "dir"
[[components.acestep_weights.detect]]
kind = "path"
ref = "launch:acestep.cwd"
sub = "checkpoints/vae"
is = "dir"
[[components.acestep_weights.detect]]
kind = "path"
ref = "launch:acestep.cwd"
sub = "checkpoints/Qwen3-Embedding-0.6B"
is = "dir"
[[components.acestep_weights.steps]]
kind = "download"
argv = ["uv", "run", "acestep-download"]
cwd = "{launch:acestep.cwd}"
source = "huggingface.co/ACE-Step/Ace-Step1.5"
file = "acestep-v15-turbo, acestep-5Hz-lm-1.7B, vae, Qwen3-Embedding-0.6B"

# -- ComfyUI: sound effects (Stable Audio 3) and fast keyframes (FLUX.2 klein distilled) -------------------------------
