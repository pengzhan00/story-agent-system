[components.longcat_runtime.layout]
"tool:longcat.root" = "longcat-avatar-mlx"
"tool:longcat.python" = "longcat-avatar-mlx/.venv/bin/python"
"tool:longcat.weights_dir" = "longcat-avatar-mlx/weights"
[[components.longcat_runtime.detect]]
kind = "path"
ref = "tool:longcat.python"
is = "exec"
[[components.longcat_runtime.detect]]
kind = "path"
ref = "tool:longcat.root"
sub = "longcat_video_avatar_mlx.egg-info"
is = "dir"
[[components.longcat_runtime.steps]]
kind = "command"
argv = ["git", "clone", "https://github.com/xocialize/longcat-avatar-mlx.git", "{tool:longcat.root}"]
[[components.longcat_runtime.steps]]
kind = "command"
argv = ["uv", "venv", "--python", "3.11", "{tool:longcat.root}/.venv"]
[[components.longcat_runtime.steps]]
kind = "command"
argv = ["uv", "pip", "install", "--python", "{tool:longcat.python}", "-e", "{tool:longcat.root}"]

[components.longcat_weights]
capability = "avatar"
size_gib = 23.0
measured = true
license = "MIT"
url = "https://huggingface.co/mlx-community/LongCat-Video-Avatar-1.5-q4-dmd-merged"
after = ["hf_cli", "longcat_runtime"]
[[components.longcat_weights.detect]]
kind = "path"
ref = "tool:longcat.weights_dir"
sub = "{tool:longcat.variant_dir}"
is = "dir"
[[components.longcat_weights.detect]]
kind = "hf_cache"
repos = ["openai/whisper-large-v3"]
[[components.longcat_weights.steps]]
kind = "download"
argv = ["hf", "download", "mlx-community/LongCat-Video-Avatar-1.5-q4-dmd-merged", "--local-dir",
        "{tool:longcat.weights_dir}/{tool:longcat.variant_dir}"]
source = "huggingface.co/mlx-community/LongCat-Video-Avatar-1.5-q4-dmd-merged"
file = "LongCat-Video-Avatar-1.5-q4-dmd-merged"
size_gib = 23.0
[[components.longcat_weights.steps]]
kind = "download"
argv = ["hf", "download", "openai/whisper-large-v3", "--include", "*.json"]
source = "huggingface.co/openai/whisper-large-v3"
file = "configuration/preprocessor json files only"
size_gib = 0.01

# -- optional: MiniMax H3 (h3.c) -------------------------------------------------------------------------------------------
[components.h3_runtime]
capability = "h3"
size_gib = 0.01
license = "MIT"
url = "https://github.com/antirez/h3.c"
health = ["tool.h3"]
after = ["xcode_clt"]
[components.h3_runtime.layout]
"tool:h3.binary" = "h3.c/h3"
[[components.h3_runtime.detect]]
kind = "path"
ref = "tool:h3.binary"
is = "exec"
[[components.h3_runtime.steps]]
kind = "command"
argv = ["git", "clone", "https://github.com/antirez/h3.c.git", "{tool:h3.binary|dir}"]
[[components.h3_runtime.steps]]
kind = "command"
argv = ["make"]
cwd = "{tool:h3.binary|dir}"

[components.h3_weights]
capability = "h3"
size_gib = 196.0
measured = true
license = "MiniMax H3 Community License (territory limits; not for commercial use in EU/UK/South Korea/USA)"
url = "https://huggingface.co/MiniMaxAI/MiniMax-H3"
after = ["hf_cli", "h3_runtime"]
[components.h3_weights.layout]
"tool:h3.model_dir" = "MiniMax-H3"
[[components.h3_weights.detect]]
kind = "path"
ref = "tool:h3.model_dir"
sub = "model_index.json"
is = "file"
[[components.h3_weights.steps]]
kind = "download"
argv = ["hf", "download", "MiniMaxAI/MiniMax-H3", "--local-dir", "{tool:h3.model_dir}"]
source = "huggingface.co/MiniMaxAI/MiniMax-H3"
file = "MiniMax-H3 (all files)"

# -- optional: Draw Things (a restricted-content plan only) ---------------------------------------------------------------
[components.drawthings_app]
capability = "drawthings"
size_gib = 0.3
license = "Draw Things terms"
url = "https://drawthings.ai"
health = ["drawthings"]
[[components.drawthings_app.detect]]
kind = "app"
names = ["Draw Things.app"]
[[components.drawthings_app.steps]]
kind = "manual"
note_key = "setup.step.drawthings"
show = "App Store > Draw Things; then Settings > Advanced > API Server"
