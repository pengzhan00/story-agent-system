# New-machine install guide: what the pipeline depends on, how to tell it is there, and what to do when it is not.
# Read by `storyagent setup ...` and the web page "Setup guide". Nothing in here runs by itself: the guide only
# detects, lists and prints; a step runs only when the operator names it (`storyagent setup run STEP`) and confirms it.
# Override or extend in $STORY_AGENT_HOME/config/setup.toml (tables are deep-merged: add your own [components.X]).
#
# Layout of the catalog
#   [machine]                 what the computer must be; defaults for the guide itself
#   [capabilities.X]          a unit you can install or leave out (images, voice, video ...); `needs` pulls in others
#   [profiles.X]              a named choice of capabilities: required / recommended (everything else is optional)
#   [components.X]            one dependency: how to detect it ([[detect]]) and how to install it ([[steps]])
#
# Paths come from the normal configuration (services.toml / models.toml), so a step names them by reference:
#   {tool:cosyvoice.root}  [tools.cosyvoice] root      {model:flux2-klein-base-4b.weights}  [models.X] weights
#   {launch:acestep.cwd}   [launch.acestep] cwd        {...|dir}  the parent folder of that path
#   {raw:~/path}           a literal path              {python} {repo} {recipes} {item}
# `layout` of a component maps such a reference to a folder below the install root chosen with `--root`; without a
# root every tool is installed where the configuration already says it lives.
#
# Detection checks (`kind`):
#   command  name [, min_version, version_argv, version_re]   a program on PATH
#   run      argv [, contains, label]                          a command whose exit code (0) / output says it is there
#   path     ref [, sub, is = file|dir|exec|any, label]        a file or folder
#   app      names                                             a macOS app bundle in /Applications or ~/Applications
#   ffmpeg_filter  names                                       filters the ffmpeg in use must have (libass: subtitles)
#   ollama_models                                              the models the LLM roles name, on the Ollama backend
#   comfy_files  files = [{class, input, name}]                files ComfyUI can see (asks the running ComfyUI)
#   hf_cache repos                                             repositories in the local Hugging Face cache
#   web_dist                                                   the web client is built
#   database                                                   the database exists
#   voices   min                                               voices in the asset library
# Steps (`kind`): command (an argv list, never a shell) | download (a command that fetches model weights: source,
# file and size are shown and it needs an explicit yes) | manual (text only: needs a person, a login or a licence).

[machine]
arch = "arm64"
system = "Darwin"
min_macos = "14.0"              # MLX needs a recent macOS; only a warning
disk_margin_gib = 20            # free space that should remain after all downloads
memory_budget_share = 0.75      # [runtime] memory_budget_gib the guide writes = this share of the installed memory
default_root = "~/storyagent-tools"   # a suggestion for --root; nobody is forced to use it
app_dirs = ["/Applications", "~/Applications"]

# -- capabilities -----------------------------------------------------------------------------------------------------
# rec_ram_gib: memory that runs it comfortably (the models of that stage are heavy; the queue runs one at a time)
[capabilities.base]
rec_ram_gib = 0
[capabilities.hub]
needs = ["base"]
[capabilities.story]
needs = ["base"]
rec_ram_gib = 32
min_ram_gib = 24
[capabilities.image]
needs = ["base", "hub"]
rec_ram_gib = 24
min_ram_gib = 16
[capabilities.voice]
needs = ["base", "hub"]
rec_ram_gib = 8
[capabilities.asr]
needs = ["base", "hub"]
rec_ram_gib = 4
[capabilities.music]
needs = ["base", "hub"]
rec_ram_gib = 20
min_ram_gib = 16
[capabilities.comfy]
needs = ["base"]
[capabilities.sfx]
needs = ["base", "comfy"]
rec_ram_gib = 12
[capabilities.keyframe_fast]
needs = ["base", "comfy"]
rec_ram_gib = 16
[capabilities.video]
needs = ["base"]
rec_ram_gib = 64
min_ram_gib = 36
[capabilities.voice_convert]
needs = ["base", "hub"]
rec_ram_gib = 10
[capabilities.avatar]
needs = ["base", "hub"]
rec_ram_gib = 32
[capabilities.h3]
needs = ["base", "hub"]
rec_ram_gib = 48
[capabilities.drawthings]
needs = ["base"]

# -- profiles ---------------------------------------------------------------------------------------------------------
[profiles.story]
required = ["story"]

[profiles.stills]
required = ["story", "image", "voice"]
recommended = ["asr", "music", "sfx"]

[profiles.full]
required = ["story", "image", "voice", "music", "video"]
recommended = ["asr", "sfx"]

[profiles.everything]
required = ["story", "image", "voice", "music", "video", "asr", "sfx"]
recommended = ["keyframe_fast", "voice_convert"]

# -- components, in the order they should be installed ----------------------------------------------------------------

[components.homebrew]
capability = "base"
size_gib = 0.5
license = "BSD-2-Clause"
url = "https://brew.sh"
[[components.homebrew.detect]]
kind = "command"
name = "brew"
[[components.homebrew.steps]]
kind = "manual"
note_key = "setup.step.homebrew"
show = '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'

[components.xcode_clt]
capability = "base"
size_gib = 1.5
license = "Apple"
after = ["homebrew"]
[[components.xcode_clt.detect]]
kind = "run"
argv = ["xcode-select", "-p"]
label = "Command Line Tools"
[[components.xcode_clt.steps]]
kind = "manual"
note_key = "setup.step.xcode_clt"
show = "xcode-select --install"

[components.uv]
capability = "base"
size_gib = 0.05
license = "MIT / Apache-2.0"
url = "https://docs.astral.sh/uv/"
after = ["homebrew"]
[[components.uv.detect]]
kind = "command"
name = "uv"
[[components.uv.steps]]
kind = "command"
argv = ["brew", "install", "uv"]

[components.ffmpeg_full]
capability = "base"
size_gib = 2.0
license = "GPL-3.0-or-later (build with libass, whisper)"
url = "https://formulae.brew.sh/formula/ffmpeg-full"
health = ["tool.ffmpeg"]
after = ["homebrew"]
[[components.ffmpeg_full.detect]]
kind = "ffmpeg_filter"
names = ["subtitles"]
[[components.ffmpeg_full.steps]]
kind = "command"
argv = ["brew", "install", "ffmpeg-full"]

[components.web_client]
capability = "base"
size_gib = 0.3
measured = true
license = "MIT (React, Vite)"
after = ["homebrew"]
[[components.web_client.detect]]
kind = "web_dist"
[[components.web_client.steps]]
kind = "command"
argv = ["brew", "install", "node", "pnpm"]
[[components.web_client.steps]]
kind = "command"
argv = ["pnpm", "install", "--frozen-lockfile"]
cwd = "{repo}/web"
[[components.web_client.steps]]
kind = "command"
argv = ["pnpm", "build"]
cwd = "{repo}/web"

[components.database]
capability = "base"
size_gib = 0.0
license = "-"
[[components.database.detect]]
kind = "database"
[[components.database.steps]]
kind = "command"
argv = ["{python}", "-m", "storyagent", "db", "migrate"]

[components.hf_cli]
capability = "hub"
size_gib = 0.05
license = "Apache-2.0"
url = "https://huggingface.co/docs/huggingface_hub/guides/cli"
after = ["uv"]
[[components.hf_cli.detect]]
kind = "command"
name = "hf"
[[components.hf_cli.steps]]
kind = "command"
argv = ["uv", "tool", "install", "huggingface_hub[cli]"]

# -- story: Ollama and the language model ------------------------------------------------------------------------------
[components.ollama]
capability = "story"
size_gib = 0.2
license = "MIT"
url = "https://ollama.com"
health = ["ollama"]
after = ["homebrew"]
[[components.ollama.detect]]
kind = "command"
name = "ollama"
[[components.ollama.steps]]
kind = "command"
argv = ["brew", "install", "ollama"]

[components.llm_model]
capability = "story"
size_gib = 20.0
measured = true
license = "Apache-2.0 (Gemma 4)"
url = "https://ollama.com/library/gemma4"
after = ["ollama"]
[components.llm_model.known_sizes]
"gemma4:31b" = 20.0
[[components.llm_model.detect]]
kind = "ollama_models"
[[components.llm_model.steps]]
kind = "download"
foreach = "llm_models"
argv = ["ollama", "pull", "{item}"]
source = "ollama.com/library/{item}"
file = "{item}"
needs_service = "ollama"

# -- images: mflux (FLUX.2 klein 4B) ------------------------------------------------------------------------------------
[components.mflux]
capability = "image"
size_gib = 1.0
license = "MIT"
url = "https://github.com/filipstrand/mflux"
health = ["tool.mflux"]
after = ["uv"]
[[components.mflux.detect]]
kind = "path"
ref = "tool:mflux.bin_dir"
sub = "mflux-generate-flux2"
is = "exec"
[[components.mflux.detect]]
kind = "path"
ref = "tool:mflux.bin_dir"
sub = "mflux-generate-flux2-edit"
is = "exec"
[[components.mflux.detect]]
kind = "path"
ref = "tool:lora_train.command"
is = "exec"
[[components.mflux.steps]]
kind = "command"
argv = ["uv", "tool", "install", "mflux==0.22.0"]

[components.flux_klein_base_4b]
capability = "image"
size_gib = 22.0
measured = true
license = "Apache-2.0"
url = "https://huggingface.co/black-forest-labs/FLUX.2-klein-base-4B"
after = ["hf_cli"]
[components.flux_klein_base_4b.layout]
"model:flux2-klein-base-4b.weights" = "models/flux2-klein-base-4B"
"model:flux2-klein-base-4b-edit.weights" = "models/flux2-klein-base-4B"
"tool:lora_train.base_model_dir" = "models/flux2-klein-base-4B"
[[components.flux_klein_base_4b.detect]]
kind = "path"
ref = "model:flux2-klein-base-4b.weights"
sub = "model_index.json"
is = "file"
[[components.flux_klein_base_4b.detect]]
kind = "path"
ref = "model:flux2-klein-base-4b.weights"
sub = "transformer"
is = "dir"
[[components.flux_klein_base_4b.steps]]
kind = "manual"
note_key = "setup.step.hf_login"
show = "hf auth login"
[[components.flux_klein_base_4b.steps]]
kind = "download"
argv = ["hf", "download", "black-forest-labs/FLUX.2-klein-base-4B", "--local-dir", "{model:flux2-klein-base-4b.weights}"]
source = "huggingface.co/black-forest-labs/FLUX.2-klein-base-4B"
file = "FLUX.2-klein-base-4B (diffusers folder + single file)"

# -- voice: CosyVoice 3 -------------------------------------------------------------------------------------------------
[components.cosyvoice_runtime]
capability = "voice"
size_gib = 2.0
measured = true
license = "Apache-2.0"
url = "https://github.com/FunAudioLLM/CosyVoice"
health = ["tool.cosyvoice"]
after = ["uv", "xcode_clt"]
[components.cosyvoice_runtime.layout]
"tool:cosyvoice.root" = "cosyvoice"
"tool:cosyvoice.python" = "cosyvoice/venv/bin/python"
"tool:cosyvoice.workdir" = "cosyvoice/CosyVoice"
[[components.cosyvoice_runtime.detect]]
kind = "path"
ref = "tool:cosyvoice.python"
is = "exec"
[[components.cosyvoice_runtime.detect]]
kind = "path"
ref = "tool:cosyvoice.workdir"
sub = "cosyvoice/cli/cosyvoice.py"
is = "file"
[[components.cosyvoice_runtime.steps]]
kind = "command"
argv = ["git", "clone", "--recursive", "https://github.com/FunAudioLLM/CosyVoice.git", "{tool:cosyvoice.workdir}"]
[[components.cosyvoice_runtime.steps]]
kind = "command"
argv = ["uv", "venv", "--python", "3.10", "{tool:cosyvoice.root}/venv"]
[[components.cosyvoice_runtime.steps]]
kind = "command"
argv = ["uv", "pip", "install", "--python", "{tool:cosyvoice.python}", "-r", "{recipes}/cosyvoice-venv.txt"]
[[components.cosyvoice_runtime.steps]]
kind = "manual"
note_key = "setup.step.cosyvoice_pynini"
show = "uv pip install --python {tool:cosyvoice.python} pynini==2.1.5   # or: conda install -c conda-forge pynini==2.1.5"

[components.cosyvoice3_weights]
capability = "voice"
size_gib = 9.1
measured = true
license = "Apache-2.0"
url = "https://huggingface.co/FunAudioLLM/Fun-CosyVoice3-0.5B-2512"
after = ["hf_cli", "cosyvoice_runtime"]
[components.cosyvoice3_weights.layout]
"model:cosyvoice3-0.5b.model_dir" = "models/cosyvoice3/Fun-CosyVoice3-0.5B"
[[components.cosyvoice3_weights.detect]]
kind = "path"
ref = "model:cosyvoice3-0.5b.model_dir"
sub = "cosyvoice3.yaml"
is = "file"
[[components.cosyvoice3_weights.detect]]
kind = "path"
ref = "model:cosyvoice3-0.5b.model_dir"
sub = "llm.pt"
is = "file"
[[components.cosyvoice3_weights.steps]]
kind = "download"
argv = ["hf", "download", "FunAudioLLM/Fun-CosyVoice3-0.5B-2512", "--local-dir", "{model:cosyvoice3-0.5b.model_dir}"]
source = "huggingface.co/FunAudioLLM/Fun-CosyVoice3-0.5B-2512"
file = "Fun-CosyVoice3-0.5B-2512"

[components.voice_library]
capability = "voice"
size_gib = 0.0
license = "-"
after = ["database"]
[[components.voice_library.detect]]
kind = "voices"
min = 1
[[components.voice_library.steps]]
kind = "manual"
note_key = "setup.step.voice_library"
show = 'storyagent library add REF.wav --role voice --name NAME --text "what the clip says" --consent'

# -- speech recognition: whisper.cpp ------------------------------------------------------------------------------------
[components.whisper_cli]
capability = "asr"
size_gib = 0.1
license = "MIT"
url = "https://github.com/ggml-org/whisper.cpp"
health = ["tool.whisper"]
after = ["homebrew"]
[[components.whisper_cli.detect]]
kind = "command"
name = "whisper-cli"
[[components.whisper_cli.steps]]
kind = "command"
argv = ["brew", "install", "whisper-cpp"]

[components.whisper_model]
capability = "asr"
size_gib = 1.5
measured = true
license = "MIT"
url = "https://huggingface.co/ggerganov/whisper.cpp"
after = ["hf_cli"]
[components.whisper_model.layout]
"tool:whisper.model" = "models/whisper/ggml-large-v3-turbo.bin"
[[components.whisper_model.detect]]
kind = "path"
