[pacing]
# Average planned shot length: with the target length it decides how many acts, scenes and shots to write.
avg_shot_sec = 4.0
# With an explicit target the episode counts as the right length within target +/- tolerance (a fraction).
tolerance = 0.2

[mix]
voice_gain = 1.0
bgm_gain = 0.16
sfx_gain = 0.5
lead_in_sec = 0.4
loudnorm_i = -16.0
loudnorm_tp = -1.5
loudnorm_lra = 11.0
max_slowdown = 2.2

[edit]
# Cards and transitions of the finished episode (per project: projects.settings.edit with the same keys). Off by
# default: a series episode usually jumps straight into its hook.
scene_fade_sec = 0.0     # dip through black at a change of scene (0 = hard cut)
title_card = false       # "S1 E3" and the episode title before the story
recap_card = false       # "previously": the last episode's summary before the story
next_card = false        # "to be continued" (and the next episode's title) after the story
title_sec = 2.0
recap_sec = 3.5
next_sec = 2.5

[subtitles]
font = "PingFang SC"
font_size = 16
margin_v = 42
outline = 1
bold = false
colour = "FFFFFF"            # RRGGBB
outline_colour = "000000"
back_colour = "000000"
border_style = 1             # 1 = outline, 3 = opaque box behind the text
alignment = 2                # 2 = bottom centre, 8 = top centre, 5 = middle

[qc]
# Thresholds carried over from the legacy quality gate.
min_file_bytes = 4096
min_duration_sec = 1.0
min_width = 320
min_height = 180
max_black_ratio = 0.85
freeze_sec = 1.5
require_audio = true
min_mean_volume_db = -45.0
aspect_tolerance = 0.08
# Picture artifacts (advisory: reported, never blocking). Measured on a small grey copy of the film; the limits are set above
# anything seen in the pilot clips, so they flag only obvious stripes and brightness pumping. Calibrate on your own footage.
artifacts = true               # false = skip the measurement (it decodes the whole film once)
artifact_fps = 24              # frames analysed per second at most
artifact_width = 128
artifact_height = 224
flicker_amp = 6.0              # a frame-to-frame brightness swing of this many levels (0-255), up and down in a row
flicker_window_sec = 1.0
max_flicker_sec = 0.5          # more flagged time than this fails the (advisory) check
stripe_amp = 8.0               # row-to-row brightness variation (levels) inside one block of the frame
stripe_ratio = 3.0             # ... and this many times the column-to-column variation of the same block
stripe_min_sec = 0.25
max_banding_sec = 0.5

[estimate]
# Assumptions for the size estimate in the creation wizard (a rough count before any story exists).
lines_per_shot = 1.5          # spoken lines per shot
sfx_per_shot = 1.0            # sound effects per shot
characters_per_work = 4       # portraits made once for the whole work
locations_per_season = 3      # location images made per season
