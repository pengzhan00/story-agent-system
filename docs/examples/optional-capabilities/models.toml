# Optional local profiles. Merge into config/models.toml; no defaults change.
[models."juggernaut-sdxl-drawthings"]
kind = "image.generate"
provider = "drawthings"
family = "sdxl"
heavy = true
license_tag = ""
commercial_ok = false          # checkpoint licence not independently verified
timeout_sec = 1800
api_model = "juggernautxl_ragnarok_f16.ckpt"
[models."juggernaut-sdxl-drawthings".params]
width = 1024
height = 1024
steps = 28
guidance = 5.0
sampler = "Euler A Trailing"

# ---- LTX-2.3 备用:Draw Things HTTP 无声视频(显示名 "LTX-2.3 22B [distilled] 1.1 (8-bit S)")
[models."ltx-2.3-drawthings"]
kind = "video.generate"   # Draw Things HTTP 只回帧数组;音画一体用 Phosphene LTX-2.5
provider = "drawthings"
family = "ltx-2.3"
heavy = true
est_memory_gib = 32
license_tag = "ltx-community"
commercial_ok = false
prompt_profile = "cinematic_en"
timeout_sec = 7200
api_model = "ltx_2.3_22b_distilled_1.1_i8x.ckpt"
[models."ltx-2.3-drawthings".params]
steps = 8
guidance = 1.0
width = 512
height = 896
frames = 121
fps = 24
[models."ltx-2.3-drawthings".tiers.draft]
width = 320
height = 576
frames = 25
