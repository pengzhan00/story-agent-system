# Append to config/pipelines.toml, merging tables if they already exist.
# Local default transition: Draw Things generation; ComfyUI editing is explicitly optional.
# Existing project-level model overrides and frozen jobs are not rewritten.

[pipelines.vertical_drama]
requires = ["ollama", "acestep", "phosphene", "tool.ffmpeg", "tool.cosyvoice", "drawthings"]
[pipelines.vertical_drama.models]
"image.generate" = "flux2-klein-4b-drawthings"
"image.edit" = "flux2-klein-4b-edit-comfy"
[pipelines.vertical_drama.workflow]
keyframe_from_references = false

